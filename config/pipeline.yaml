# ============================================================================
#  BOYD CLIPS — PIPELINE CONFIGURATION
#  Single source of truth for every knob in the system.
#  Nothing in src/ hardcodes a value that belongs here.
# ============================================================================

source:
  # The court's YouTube channel. /streams is the reliable listing tab —
  # the /videos tab returns duplicate entries under some yt-dlp versions.
  channel_url: "https://www.youtube.com/@judgestephanieboyd4233/streams"
  channel_name: "Judge Stephanie Boyd"
  court: "187th District Court, Bexar County, Texas"

  # How many recent streams to examine on each discovery run.
  scan_depth: 8

  # Ignore streams shorter than this (test streams, aborted sessions).
  min_duration_s: 900

  # Ignore streams older than this many days on a discovery run.
  max_age_days: 4

autonomy:
  # manual   -> render everything, publish nothing. Files land in out/review/.
  # assisted -> upload as PRIVATE/draft on each platform; you flip to public.
  # auto     -> publish public with no human in the loop.
  #
  # PROMOTION PATH: do not move to "auto" on a hunch. state/ledger tracks
  # approve/reject per clip. `boyd stats` prints the approval rate. The
  # documented gate is >= 30 consecutive approvals with zero safety rejects.
  mode: manual

  promotion_gate:
    min_consecutive_approvals: 30
    max_safety_rejects: 0

output:
  # ---- The daily funnel -------------------------------------------------
  # One long-form video (the full case) + one short (hook clip) that points
  # back at it. The long-form MUST publish first so its URL can be baked
  # into the short's description. This ordering is enforced in publish.py.
  clips_per_day: 1
  # Global run budget. A failed case cannot silently start another full image
  # batch after this many generated images have already been reported.
  max_thumbnail_images_per_run: 9
  bank_extras: true          # qualifying runners-up go to out/bank/ for slow days

  longform:
    # The full case, trimmed. Horizontal, source aspect preserved.
    #
    # BOTH bounds are enforced in pipeline.produce(), before the encode.
    # They were documented here and enforced nowhere until 2026-08-17: a 33.9
    # minute long-form went through a 1200s cap. Under the floor the case is
    # skipped; over the cap the STORY-PRESERVING planner (cap_fit below,
    # src/boydclips/capfit.py, 2026-09-06) protects setup, money moment and
    # ending and drops the material farthest from them — it no longer walks
    # from the front and cuts the tail. (A dead `min_duration_s: 120` sat here until
    # 2026-09-01; PyYAML kept the later 360 silently. tools/hearing_measure.py
    # now refuses duplicate keys.)
    # 3480s = 58 min.
    #
    # RE-MEASURED 2026-08-18 against the FULL catalogues of all 7 channels
    # clipping this docket (3,645 videos), not a filtered era of one. The
    # earlier figures in this block were wrong in two different ways and both
    # are recorded here so they are not re-derived.
    #
    # WRONG #1 — "0-10m 0.57x ... 30-35m 1.69x, monotonic". Measured on 1,785
    # videos from 3 channels. The 1.69x does not replicate; on 3,645 videos the
    # 30-35m band is 1.23x.
    #
    # WRONG #2 — "@courtroomtime 50-58m 1.35x" was n=89 from a hand-picked
    # pre-Oct-2025 era. Across all 553 of their videos the 50-58m band is
    # 1.06x and 58-70m is 1.04x. The 1.35x was an artefact of the filter.
    #
    # WRONG #3 (mine, same day) — pooling all 7 channels showed duration flat
    # past 20m (1.04x). That pooling was itself the error: it averages across
    # channels whose house runtimes differ by 4x. WITHIN each channel the
    # effect is real and large. Do not pool channels for duration again.
    #
    # WITHIN-CHANNEL, decile-normalised, full catalogues:
    #   Court Trials TV (n=899, the #1 channel in this niche, 134K subs):
    #     0-10m 0.55x | 10-20m 0.92x | 20-30m 1.62x | 30-40m 2.53x
    #     raw medians 6.2K | 11K | 20K | 32K | 40m+ 47K  — monotonic, no ceiling
    #     found inside their catalogue.
    #   Courtroom Time (n=553, 46K subs, median runtime 56m):
    #     10-20m 0.66x | 20-30m 1.21x | 30-40m 0.65x | 40-58m ~1.06x | 58-70m 1.04x
    #
    # WHAT ACTUALLY HOLDS: the FLOOR. Under 20 minutes is punished on 6 of 7
    # channels. The CEILING is not established by any channel's own data — no
    # band above 20m is punished anywhere. 3480 is kept because nothing
    # contradicts it, NOT because 58 minutes was shown to be the peak.
    #
    # CONFOUND, measured and material (see analysis.repeat_defendant below):
    # on Court Trials TV the share of videos that are RETURN APPEARANCES rises
    # with duration — 33% at 0-20m, 51% at 20-30m, 62% at 30-40m — and the
    # repeat format out-performs one-offs INSIDE every band (1.20x / 1.24x /
    # 1.84x). Part of what reads as "longer is better" on the biggest channel
    # is "multi-hearing episodes are better". Treat duration as a floor and the
    # repeat format as the lever.
    # 2026-08-21, Nathan: "8min to 20 ... but 50 min is way too long", with
    # 6-7 minutes as the floor below which a hearing is too thin. The old 3480
    # came from a channel whose house style is hour-long compilations; Court
    # Trials TV, which outperforms it two to one, runs a 16-minute median.
    min_duration_s: 360
    max_duration_s: 1200

    # Story-preserving cap (2026-09-06, src/boydclips/capfit.py). When the
    # dead-air-trimmed case is longer than max_duration_s, these regions are
    # PROTECTED and survive whole; the rest of the budget goes to the material
    # nearest the story (the money moment from editorial.money_moment_s, the
    # short beats, the setup, the ending). If the protected regions alone
    # exceed the cap the case is refused with the reason, never truncated.
    cap_fit:
      setup_s: 90              # first 90 s of the case: the call, who, why
      payoff_lead_s: 30        # before the money moment
      payoff_aftermath_s: 60   # after it: the reaction and what follows
      ending_s: 45             # the last 45 s: the ruling / consequence
      min_piece_s: 2.0         # never keep a sliver shorter than this
    pad_before_s: 4.0        # start slightly before the first word
    pad_after_s: 3.0

    # Branded sting in front of the case. render_longform accepted an `intro`
    # from the start and nothing ever passed one, so every automated long-form
    # shipped unbranded.
    #
    # Defaults to boyd-brand/sting_v2.mp4 — 2.6s, 1920x1080, WITH audio. The
    # _SLOW variants are 5.1-7.7s and silent, and a silent intro forces a
    # synthesised audio branch just to keep concat happy.
    #
    # CONTENT_SPEC §2 asks for a cold open with "no intro, no branding".
    # Nathan's 2026-08-17 instruction governs; the spec should be amended.
    intro_enabled: true
    intro_path:              # blank = search the known brand folders

    # R49 (Nathan, 2026-09-02): "add a 5 second or so clip of the hook or drama
    # later in the vid in the beginning of long form and put 'Coming up...'".
    # The daily route derives the span from the case's money moment
    # (render.coldopen_span) and renders it before the sting. Skipped with a
    # logged reason when the moment is inside the first 30 s or no 3-9 s
    # sentence fits. tools/check_coldopen.py measures the rendered file.
    coldopen_enabled: true

    # After the cold open and sting, enter on Boyd calling the case instead of
    # replaying the waiting room. If the exact line is absent near the start,
    # preserve the planned body rather than guessing at a different sentence.
    start_at_court_call: true
    court_call_max_wait_s: 90
    court_call_lead_s: 0.08

    # CONTENT_SPEC §2: "Dead air longer than 4 seconds is removed. Shorter gaps
    # stay — courtroom pauses carry weight and cutting them makes proceedings
    # feel falsified."
    #
    # Until 2026-08-17 the daily path concatenated the raw sitting windows and
    # never called the trimmer, which existed. Measured on what it produced:
    # 179.6s of silence in runs over 4s across 838s (21.4%), one run of 75s,
    # and a cold open onto 4.8s of nothing. These constants are the ones the
    # Thompson rebuild was verified against — zero remaining runs over 4s,
    # opening silence 4.8s -> 0.81s.
    # SUPERSEDED 2026-08-21 by Nathan, asked directly: pauses STAY. His words:
    # "only cut if the screen goes black or she says shes gonna call them back
    # in a couple min". The four-second rule came from CONTENT_SPEC, not from
    # him, and it was cutting the tension out of every hearing - a courtroom
    # pause before an answer is the moment, not dead air.
    #
    # His actual rule needs black-frame detection, which does not exist yet.
    # Until it does, the threshold is raised so only genuinely dead stretches go
    # - a recess or a camera cut - and ordinary pauses survive. This is an
    # approximation of his rule and is recorded as one, not as his rule.
    trim_dead_air: true
    dead_air_s: 25.0         # was 4.0; see above. Not his rule, a stand-in.
    silence_noise_db: -30.0
    silence_keep_s: 0.35     # left at each end of a removed run; 0 reads as a glitch
    silence_min_piece_s: 0.5 # stutter guard, looser than a short's deliberately
    resolution: [1920, 1080]
    fps: 30
    # Preserve the already-soft 720p Zoom source through the 1080p delivery
    # encode. Lanczos plus a restrained CAS pass recovers edge definition
    # without plastic skin or halos; CRF 16 avoids adding visible softness.
    crf: 16
    preset: slow
    # Shared upload encode policy. Long-form keeps the existing high-quality
    # CRF 16 / slow path; render.encode_args also accepts average_bitrate for
    # any future video format that needs a measured bitrate floor.
    encode:
      mode: crf
      preset: slow
      crf: 16
    watermark: "D:/Boyd Clips/boyd-brand/watermarks_v2/wm_brand_halo_40.png"
    watermark_opacity: 0.45
    scale_flags: lanczos+accurate_rnd+full_chroma_int
    clarity_filter: cas=strength=0.12
    audio_bitrate: "192k"

  short:
    # The hook clip, cut from *inside* the long-form range.
    min_duration_s: 25
    max_duration_s: 59       # stay under 60s for Shorts/Reels/TikTok
    target_duration_s: 50

    # SHORTS_EDITOR_V2 (2026-09-06). `editor: v2` plans the short as a
    # mini-story — setup -> tension -> turn -> payoff — from the case's own
    # transcript (src/boydclips/shorts_editor.py), scores it out of 100
    # (hook 25 / clarity 20 / payoff 25 / escalation 15 / quote 10 / visual 5),
    # refuses with a reason, and records the whole edit plan in the manifest.
    # `legacy` restores the model-beat path (plan_short_segments) unchanged.
    editor: v2
    # THE FIXED COURTROOM LAYOUT (Nathan, 2026-09-06, third pass). A stable
    # 50/50 split - defendant top, Boyd bottom per the case's tile map -
    # with the divider at y=960 for the whole Short; each person centred in
    # their 1080x960 slot from a MEASURED subject anchor (YuNet face, median
    # over frames inside the kept ranges; geometric fallback recorded as
    # such); a punch-in is a zoom inside the speaker's tile around that
    # anchor. The 60/40 "weighted" focus layout is gone. src/boydclips/layout.py.
    punch_zoom: 1.08          # motivated punch-in on the payoff (+ a hook question); 1.06-1.12
    center_max_zoom: 1.15     # conservative: a slightly off-centre sharp face beats a centred 4x upscale
                              #   (Nathan, 2026-09-06); the residual is reported in the plan
    center_tolerance_px: 40   # residual accepted once the zoom cap is reached (recorded)
    target_y_frac: 0.42       # face centre sits above the slot's middle: natural headroom
    judge_tile: auto          # auto: recognise Boyd (tools/identity.py) on a frame
                              #   from the case; left/right: force which SOURCE
                              #   tile is hers (left is stacked on top)
    judge_tile_default: right # when recognition is unavailable; recorded as unverified
    master_audio: true        # tools/master_audio.py after the render: -14 LUFS,
                              #   -1.5 dBTP, video copied; short_raw.mp4 kept beside

    # THE "FULL VIDEO OUT NOW" CALL TO ACTION (Nathan, 2026-09-07, third
    # brief - rebuilt from scratch). A compact lower-third, about 15-20 % of
    # the frame width, low in the frame: two lines of small semi-condensed
    # bold caps (Archivo 800 / width 75, off-white, one soft shadow) and a
    # short clean stroke that leaves the side of the block, curves and
    # points down at the related-video row; the small head eases in with a
    # tiny overshoot, then ONE 2.5 px nudge toward the button. No end card,
    # no freeze, no loop, no glow. src/boydclips/cta.py; composited after
    # the watermark in the SAME ffmpeg pass (one encode); its box is part of
    # the overlay layout's collision check.
    #
    # Placement: lower-left or lower-right of the BOTTOM slot, whichever the
    # measured face (YuNet anchor grown by face_margin_frac - a hard veto),
    # the body under it, the caption rail, the watermark, YouTube's own UI
    # and the sampled picture leave clearest. Stable for the whole CTA. The
    # decision and its scores are recorded in the build (cta.scores).
    #
    # Timing (output seconds): start_s auto = end-anchored so the CTA is on
    # screen through the last frame with no fade (the video does not
    # continue). A numeric start_s earlier than that fades out after the hold.
    # Text ~280 ms (fade + 10 px rise + 98 -> 100 % scale, ease-out) ->
    # stroke draws ~500 ms from 180 ms in -> head settles ~220 ms with a
    # small overshoot -> ONE nudge -> hold ~3.7 s (about five seconds total).
    #
    # Sound: a soft UI tone as the text lands, a light swish under the draw,
    # a tiny tick as the head settles - synthesised per render and
    # level-matched by measurement to the kept dialogue (relative_db; the
    # master's fixed gain keeps that relation).
    cta:
      enabled: true
      text: "FULL VIDEO OUT NOW"
      lines: 2                 # balanced wrap: FULL VIDEO / OUT NOW
      start_s: auto            # auto | seconds (output time)
      tail_s: 0.0              # auto: seconds between the CTA's end and the last frame (>0.05 fades)
      enter_s: 0.28
      rise_px: 10
      scale_from: 0.98
      arrow_delay_s: 0.18
      draw_s: 0.50
      head_settle_s: 0.22
      head_overshoot_px: 3.0
      nudge_delay_s: 0.12
      nudge_s: 0.26
      nudge_px: 2.5
      hold_s: 3.7
      fade_s: 0.35
      side: auto               # auto | left | right
      edge_margin_px: 56
      text_top_frac: 0.75      # readable block above YouTube's lower-left related-video row
      face_margin_frac: 0.30
      scale: 1.0
      opacity: 0.95
      font: assets/fonts/Archivo-Var.ttf
      font_weight: 800
      font_width: 75           # semi-condensed
      font_size: 52
      tracking_em: 0.08
      line_gap_frac: 0.30
      color: "#F2EFE9"         # off-white
      shadow: {opacity: 0.45, blur_px: 5, dy_px: 2}
      backing: {opacity: 0.58, pad_x_px: 9, pad_y_px: 7, radius_px: 10}
      arrow:                   # a short stroke beside the block that curves down to the button row
        stroke_px: 6
        head_len_px: 20
        head_angle_deg: 30
        gap_px: 18             # between the block and the stroke's start
        reach_px: 28           # fallback sideways travel
        drop_px: 110           # fallback drop to the tip
        target: [0.36, 0.855]  # centre of YouTube's lower-left related-video pill
      ui_reserved:
        right_col_x: 0.815     # YouTube's like / comment / share column
        right_col_y: [0.52, 0.93]
        bottom_band_y: 0.885   # chip, channel row, title
      sound:
        enabled: true
        relative_db: -20.0     # SFX loudness vs the measured dialogue
        ui: true               # soft tone as the text lands
        swish: true            # light swish under the draw
        tick: true             # tiny tick as the head settles
    planner:
      min_duration_s: 15      # a complete story may be this short; nothing is padded
      target_min_s: 45        # Nathan: aim around 50 seconds, preserving key story beats.
      target_max_s: 55        # End on a truthful cliffhanger when it serves the full video.
      min_score: 55           # under this a candidate is refused as weak, with the reason
      allow_teaser: true      # cold open: the payoff line first, then in place —
      teaser_max_s: 3.0       #   declared in the plan with its source range
      # 2026-09-19: the TOTAL is no longer the only acceptance test. The opening
      # beat is floored on its own dimension (hook/25), because the rejected
      # dAKO7myCd-g:8929 cut shipped hook 7/25 on the back of payoff 20/25 and
      # still passed every gate. A declared teaser satisfies the floor. 0 disables.
      hook_min_score: 14
      dead_gap_s: 1.2         # a pause longer than this inside the body is removed...
      keep_gap_s: 0.35        #   ...down to this much on each side of the cut
      max_window_s: 95        # how far back from the payoff the body may start (raw)
      max_punch_ins: null     # editorially driven; meaningful beats and spacing govern use
      punch_in_min_spacing_s: 3.0  # avoid adjacent push-ins and visual jitter
      max_accents: 2          # flagged in the plan only — no accent assets exist yet
      # THE CONTINUITY RULE (Nathan, 2026-09-06): the body is one contiguous
      # stretch of the source; only dead air, acknowledgments, repeated
      # wording and clearly procedural filler may be removed inside it, every
      # interior join is audited (plan.interior_cuts) and a kept question is
      # always followed on screen by its actual answer (plan.question_answer).
    resolution: [1080, 1920]
    fps: 30
    # Encode (visual polish 2026-09-06): libx264 preset slow / crf 17, yuv420p
    # (was medium / crf 20 -> ~3.5 Mbps; the source is soft, so the encode
    # must not add its own softness). FPS unchanged.
    crf: 17
    preset: slow
    # A fixed high upload target avoids the prior 5.67 Mbps Short.  12 Mbps
    # leaves headroom above the 9 Mbps release floor without adding sharpening
    # or any stronger picture processing.
    encode:
      mode: average_bitrate
      preset: slow
      video_bitrate: "12M"
      minrate: "12M"
      maxrate: "12M"
      bufsize: "24M"
      x264_params: "nal-hrd=cbr:force-cfr=1"
    audio_bitrate: "160k"
    watermark: "D:/Boyd Clips/boyd-brand/watermarks_v2/wm_brand_halo_40.png"
    watermark_opacity: 0.45

    # Clarity (visual polish 2026-09-06): the tiles are 3x upscales of soft
    # Zoom footage. Better scaler first (lanczos with accurate rounding and
    # full chroma), then a restrained contrast-adaptive sharpen (cas) AFTER
    # the scale, per camera - the defendant tile carries the larger upscale.
    # Measured on Flores (tools: clarity_experiment/): cas 0.3-0.5 doubles
    # the Laplacian variance of the eye region with no visible halo; unsharp
    # 0.5 matches it but edges harder. Captions burn in after the stack, so
    # they never pass through this. null/"" disables a role.
    clarity:
      enabled: true
      scale_flags: lanczos+accurate_rnd+full_chroma_int
      defendant: cas=strength=0.40
      boyd: cas=strength=0.30
      default: cas=strength=0.30

    # Zoom court is 16:9 with multiple participants, and the court's encoder
    # bakes black bars into its own frame. Cropping to 9:16 cuts people out;
    # naively letterboxing leaves them tiny.
    #
    #   auto        detect the real content rectangle, then pick:
    #                 side-by-side 2-up  -> split the tiles and stack them
    #                 anything else      -> blurred-fill letterbox
    #   split_stack force tile stacking
    #   blur_pad    force blurred-fill letterbox
    #   center_crop force a hard 9:16 crop (will cut participants off)
    vertical_mode: auto
    autocrop: true            # strip the source's baked-in letterbox first
    blur_sigma: 28
    blur_darken: 0.55

    # Burned-in captions, driven by word-level timings from the transcript.
    #
    # These numbers are MEASURED off 12 current high-view vertical shorts
    # (yt-dlp + frame differencing at native fps), not chosen. The headline
    # finding is negative and drove the whole style: caption state changes take
    # exactly ONE frame in 340+ of ~350 measured transitions. No scale ramp, no
    # fade, no slide. Per-word karaoke highlight appeared in 1 of 9 captioned
    # winners and was the weakest performer in the set.
    #
    # Geometry from lawbyMike (4 videos, 12-19M views each, the leader in the
    # legal niche): x-height 37-39px at 1080x1920, outline 12-14px black plus a
    # small hard shadow, 2-4 words per card (mode 3), median card 500-567ms.
    # THE THOMPSON CAPTION STYLE (short_v3), which Nathan approved.
    #
    # This block used to hold Montserrat at 64 with max_lines 1. That was never
    # what shipped in the approved short — that came from
    # scripts/build_thompson_v3.py, which carried its own caption dict. So the
    # daily path and the approved reference had silently diverged, and every
    # automated short was captioned in a style nobody signed off on.
    #
    # Cap height is MEASURED, not chosen: rendered cap = 0.514 x font_size,
    # identical for Arial Black and Anton. The old 74px font put 38px of
    # visible letter against a 72px floor (BBC/EBU-TT-D vertical 3.75%,
    # cross-checked against W3C IMSC1.3). Anton at 140 clears it. At that size
    # Arial Black overflows the safe band at ~9 chars/line and Anton at ~13,
    # which is where max_chars_per_line comes from.
    captions:
      enabled: true
      font: "Anton"                  # assets/fonts/Anton-Regular.ttf
      font_size: 140
      primary_color: "&H00FFFFFF"    # ASS BGR order: white
      highlight_color: "&H0000D7FF"
      outline_color: "&H00000000"
      outline: 6
      shadow: 2
      margin_v: 700                  # overridden per-layout by produce()
      max_chars_per_line: 13         # Anton overflows the safe band past this
      max_words_per_card: 3
      max_lines: 2
      uppercase: true
      # Colour-only per-word emphasis. MEASURED: scaling one word inside a line
      # makes libass re-lay out the whole block — pop_color drifts 33px left and
      # 65px wide on every word, colour-only drifts 0/0/0.
      animation: pop_color
      pop_scale: 115
      pop_ms: 60
      card_fade_ms: 0                # hard cut — 340+ of ~350 measured
                                     # transitions in the winner set are a
                                     # single frame. No fade, no slide.

      # Speaker-anchored captions — the text sits beside whoever is talking.
      #
      # Margins are px from the bottom of the 1920 canvas, measured against the
      # safe band (text must stay inside y 288..1248). In duo_fill the
      # defendant owns the TOP half and Boyd the BOTTOM half, so the defendant's
      # slot is the larger margin.
      #
      # Turns come from src/boydclips/diarize.py (SpeechBrain ECAPA speaker
      # embeddings). Note "defendant" here means "not Boyd" — an attorney
      # speaking lands in the same slot, which is correct for placement even
      # though it is not literally the defendant.
      slot_margins:             # LEGACY path only; V2 captions live on the rail below
        defendant: 1020
        boyd: 700

      # SHORTS_EDITOR_V2 KINETIC captions (Nathan, 2026-09-06, fifth pass):
      # premium short-form captions, not subtitles. One line only, anchored
      # on the divider (540, 960); a phrase never holds two speakers (the
      # verified speaker label is an input constraint to the planner, so a
      # cross-speaker card cannot exist); the phrase BUILDS word by word as
      # it is spoken — the newest word warm yellow with a short pop-in
      # (88 -> 105 -> 100 % over ~110 ms), earlier words white and never
      # moving (the phrase is left-anchored, pre-centred on its measured
      # width); a completed phrase holds briefly and clears; a speaker change
      # starts from empty. Widths are measured with assets/fonts/Anton;
      # a phrase wider than safe_width is split, never shrunk or wrapped.
      # src/boydclips/captions.py, render.build_rail_ass. No end card.
      rail:
        preset: clean_phrase           # three named presets live in captions.py
        mode: static                   # phrase-block timing; no single-word karaoke
        rail_x: 540
        rail_y: 960
        font: "Anton"
        font_size: 82                  # restrained, phone-readable phrase block
                                       #   phrase like "YOU DON'T DO ANYTHING" is 840 px, 5 short words still fit
        safe_width: 980                # 1080 - 2 x 50 px side margins (was 960); wider phrases split, never shrink
        max_lines: 1
        outline: 6
        shadow: 2
        primary_color: "&H00FFFFFF"
        active_color: "&H003FD2FF"     # ASS BGR: warm yellow #FFD23F
        speaker_colors:
          boyd: "&H00FFFFFF"
          defendant: "&H003FD2FF"      # saturated warm gold; used only to identify speaker
        # The new chunk's entrance (visual polish 2026-09-06): an eased overshoot,
        # 92 % -> 106 % at 55 ms (ease-out) -> 100 % at 110 ms (ease-in), with a
        # 0 -> 100 % opacity rise over the first 60 ms. Only the new chunk moves.
        pop_ms: 110
        pop_from: 92
        pop_peak: 106
        pop_rise_ms: 55
        pop_fade_ms: 60
        ease_rise: 0.6
        ease_settle: 1.3
        ease_fade: 0.7
        hold_s: 1.0
        gap_ms: 60
        target_words: 5.0
        min_words: 3
        max_words: 7
        hard_max_words: 9
        # Chunk build (sixth pass): a phrase is revealed in 1-3 natural
        # micro-phrases, the new chunk yellow with the pop, about 1-2 visual
        # changes per second on average; QC ceiling density_max.
        max_chunks: 1
        min_chunk_words: 2
        density_target: 1.5
        density_max: 2.5
        # Display-only disfluency cleanup (audio untouched, audited per word
        # in the plan): fillers, immediate repeats, pronoun restarts, a
        # trailing abandoned stumble. Negation, numbers, names, answers and
        # intentional emphasis are never omitted.
        clean_disfluencies: true
        planner: deterministic         # a registered provider name swaps the phrase planner;
                                       #   unavailable/invalid -> deterministic

    # Colour grade, applied to the PICTURE only — before the captions burn in,
    # so caption white is never lifted or clipped.
    #
    # `eq=brightness` raises every pixel including the ones already near white,
    # so the jail scrubs and the overhead lights blow out and the frame reads
    # washed rather than bright. The curve lifts shadows and midtones instead
    # and pulls the top end down to 0.97, so highlights roll off and the whites
    # survive.
    color:
      enabled: true
      # 2026-09-06: the daily renderer graded with the curve below while the
      # shorts Nathan shipped came off the manual chain with the SHORT FLOOR
      # grade (config/short_floor.json grade.eq, solved against
      # SANCHEZ_SHORT_FINAL by tools/solve_grade.py). He read the first
      # SHORTS_EDITOR_V2 render as "colour correction disappeared": the daily
      # curve was there, the floor grade never was — in either daily path.
      #   short_floor  read grade.eq from the floor (the one source for the
      #                manual chain, the legacy daily path and V2); a missing
      #                key fails, it does not default
      #   short_floor_no_brightness
      #                the floor's contrast and saturation without its global
      #                brightness=-0.10 — Nathan, 2026-09-06 ("b"): the per-
      #                camera curves below handle the highlights; the global
      #                term only darkened the faces (measured 134 -> 105)
      #   curve        the old daily block below, for reproducing old renders
      #   none         no grade
      source: short_floor_no_brightness
      curve: "0/0.02 0.25/0.31 0.5/0.57 0.75/0.80 1/0.97"
      saturation: 1.10
      contrast: 1.05
      # PER-CAMERA correction (Nathan, 2026-09-06), applied to each tile
      # BEFORE the 50/50 assembly (render.camera_grade_filter ->
      # duo_punch_filter); the floor grade above runs on the assembled frame
      # after. The defendant camera's fluorescent ceiling blows out: a luma
      # curve holds shadows and midtones and rolls off the top ~15-20 % of
      # the range with no hard clip. Boyd's camera is graded on its own
      # numbers (tools/grade_probe.py measured both).
      defendant:
        curve: "0/0 0.25/0.25 0.5/0.49 0.65/0.62 0.75/0.69 0.85/0.75 1/0.82"
      boyd:
        curve: null

transcription:
  # YouTube auto-captions are free and available on this channel. Whisper is
  # only a fallback for the rare stream published without them.
  source: auto_captions        # auto_captions | whisper | auto_captions_then_whisper
  language: "en"
  whisper_fallback: true
  whisper_model: "medium"      # only used if the fallback fires

analysis:
  # See prompts/ for the actual instructions and spec/CONTENT_SPEC.md for the
  # format contract. Model IDs live here so you can swap tiers without edits.
  #
  # backend:
  #   codex_cli   Runs authenticated `codex exec` with an explicit model,
  #               read-only sandbox, tools disabled, and an output schema.
  #   claude_cli  Runs `claude -p` headless against your existing Claude Code
  #               login. No API key, no separate bill. Schema conformance is
  #               enforced client-side with a retry loop (see llm.py).
  #   sdk         Anthropic SDK. Needs ANTHROPIC_API_KEY or an `ant auth`
  #               profile. Gains API-enforced structured outputs and `effort`.
  backend: codex_cli

  # WHICH BRAIN ANSWERS (updated 2026-09-19, Nathan: Astra orchestrates and
  # DeepSeek 4.1 does the production work as cheaply as practical).
  #
  # gpt-5.6-sol is UNREACHABLE from this PC. Two independent checks:
  #   - `codex login` -> "ChatGPT login is disabled. Use API key login instead."
  #     so the ChatGPT-plan route that used to carry Sol is closed by the build;
  #   - this machine's Codex CLI is configured for the deepseek provider, and
  #     that endpoint answers gpt-5.6-sol with
  #     "The supported API model names are deepseek-flash, deepseek-v4-pro".
  # Claude Code is not an option either: `claude -p` returns
  #   "Your organization has disabled Claude subscription access for Claude
  #    Code" (403).
  #
  # Official DeepSeek docs expose V4.1 Flash through the stable API name
  # `deepseek-flash`. The pipeline reaches it through the SAME isolated
  # `codex exec` call with the same read-only sandbox, disabled tools and
  # output-schema enforcement; only the provider and model name change. The
  # provider block below is opt-in: delete it and the backend behaves exactly as
  # it did before this date. Restore Sol by putting an OpenAI credential back on
  # this machine and setting model back to "gpt-5.6-sol".
  model: "deepseek-flash"

  # Non-default API provider for the isolated Codex CLI session. The key is
  # read from the environment variable named here; config/.env (gitignored)
  # supplies it. It is never written into the command line.
  provider:
    name: deepseek
    base_url: "https://api.deepseek.com/"
    wire_api: responses
    env_key: DEEPSEEK_API_KEY

  cli_timeout_s: 1800       # CLI backends; a 3-hour docket is a long call
  # 2026-09-16 (the DeepSeek switch): one docket came back as malformed JSON and
  # this value — one attempt per call — left it unscored. The retry path in
  # src/boydclips/llm.py now carries the rejection back into the prompt, so a
  # second attempt would be a real repair instead of a repeat, but the count
  # stays at 1: the contract's "one attempt per call" is Nathan's cost policy,
  # not a model detail, so raising it is his call. The prompt hint is dormant
  # until he raises it.
  cli_attempts: 1
  max_model_calls_per_run: 20  # total model-call ceiling incl. analysis, Producer, and thumbnail sessions
  producer_brain:
    enabled: true           # one validated pre-edit plan; owns the A/B/C packaging pairs

  effort: "high"            # DeepSeek Flash supports low/high/max; high is its documented default
  max_tokens: 32000         # sdk only

  # Cases scored per call. Each scored case emits five justifications, safety
  # reasoning, a summary and segment ranges.
  #
  # CORRECTION 2026-08-10 — the earlier note here blamed truncation. That was
  # wrong. stop_reason never came back as max_tokens, and the saved responses in
  # logs/rejected/ close cleanly at the end. The real failures were malformed
  # JSON mid-response: `undefined` in value position, `\'` escapes, invented
  # `*_note` fields, and on one occasion a dropped closing brace. The first
  # three are now repaired in llm.repair_json(); a dropped brace is not safely
  # repairable and must retry. Smaller batches shrink the response and with it
  # the chance of a structural break — 6 -> 4 on that basis, not on truncation.
  # Trade-off: smaller batches show the model less context per call, which
  # analyze.confirm_selection() exists to compensate for.
  score_batch_size: 4

  # A case must clear ALL of these to be eligible. Hard gates, not weights.
  #
  # CALIBRATION NOTE — min_total_score was 70 until measured against real
  # dockets. Across 18 scored cases from two sessions, 10 passed safety and
  # *none* reached 70; the best was 57.0, and no single dimension exceeded 70.
  # That is the rubric working correctly rather than failing: a pretrial docket
  # is mostly status conferences and resets, and the rubric reserves its top
  # band for liberty decided on camera. 50 is set from that distribution.
  # Re-measure before moving it again — `boyd bank` shows the current spread.
  gates:
    # BOYD_EDITORIAL_V2 (2026-09-06). Order in analyze._check_gates: safety,
    # then the editorial eligibility gate, then the score tier, then audio,
    # then shortability. Tiers (src/boydclips/editorial.py):
    #   85-100 A       exceptional
    #   78-84  MAKE    good enough to make; must pass every hard gate
    #   70-77  HOLD    manual review, ineligible_reason says what is missing
    #   <70    SKIP    do not make a video because inventory is low
    # The CALIBRATION NOTE above belongs to the retired 0-100-weighted rubric
    # (best real case 57.0 under it). The new scale sums seven dimensions on
    # their own maxima; see tools/editorial_eval.py for the re-measured set.
    min_total_score: 78        # MAKE threshold
    hold_threshold: 70         # HOLD band starts here; below it is SKIP
    safety_must_pass: true
    # The model's editorial eligibility verdict (routine / no_story / no_payoff
    # / context_dependency / fake_packaging / charge_severity / empty_conflict).
    # A failed gate is a SKIP whatever the number says.
    requires_editorial_gate: true
    min_audio_quality: 3       # 1-5, judged from transcript coherence
    # DEPRECATED, inert: requires_self_contained (retired 2026-08) and
    # requires_pushback (retired 2026-09-06 — it rewarded volume and conflict
    # over story; story_engine + clarity replace it). Neither is read.
    requires_pushback: false

    # A long-form with no short gets no discovery traffic — the short is the
    # entire distribution mechanism. Cases that score well but cannot be cut
    # into the four-beat structure are banked instead of published, so they
    # stay available rather than being spent on a day they can't carry.
    requires_shortable: true

    # Re-run the gate on the day's pick alone, against the full transcript,
    # before anything is downloaded. Batch scoring shows each batch only its
    # own cases' span, and safety judgements were measured moving between runs
    # because of it — three of six previously-passing cases were rejected on a
    # re-score. One extra call, placed where a wrong answer costs the most.
    recheck_selection: true

  # ---- Notoriety re-ranking --------------------------------------------
  # Does an audience for this case already exist BEFORE we publish?
  #
  # The rubric below reads the docket transcript, so it cannot tell a case the
  # city is following from a status conference. Measured on this channel
  # (2026-08-17, yt-dlp against @TexasTrialTracker/videos): every video over
  # 10K views is a named, press-covered capital murder trial — 72K, 62K, 37K —
  # while routine docket clips, which is what this pipeline makes, sit at
  # 1.4K–4.6K. About 20x between the two.
  #
  # Deliberately NOT a rubric weight: the weights sum to 100 and are mirrored
  # in prompts/score_cases.md, so adding one silently dilutes the rest, and
  # notoriety is a property of the AUDIENCE rather than of the clip. It ranks
  # cases that have ALREADY passed safety and the rubric. It cannot promote
  # anything past a gate — SAFETY_RULES stays in front of it, because this axis
  # points at the most sensational cases about real presumed-innocent people.
  #
  # !! NOT IMPLEMENTED !! Verified 2026-08-18: the string "notoriety" appears
  # in this file and NOWHERE else in the repository. Zero call sites in
  # src/boydclips/. `enabled: true` does nothing; check_coverage makes no
  # network call; rubric_weight is never read. This block is a note, not a
  # rule. Either wire it into analyze.score() or delete it.
  #
  # Its underlying claim IS supported and got stronger on 2026-08-18: this
  # channel's 7 named-trial videos have a median of 16,000 views against
  # 3,000 for its 7 Boyd docket clips (5.3x), and the trial coverage carries
  # 90% of all channel views. That is the strongest signal measured on OUR
  # OWN data. It is also still only 14 videos.
  notoriety:
    enabled: false   # was true, which was misleading — nothing reads it

    # One YouTube search per eligible case. Local news coverage is the primary
    # signal — KSAT/KENS sending a camera means the city is already watching.
    # Turn off to rank on charge severity alone (no network calls).
    check_coverage: true

    # Toward 1.0 trusts the rubric; toward 0.0 chases notoriety.
    #
    # 0.7 — deliberately rubric-heavy, corrected down from 0.5 on 2026-08-17.
    # The Boyd-only rows say fame is NOT the discriminator: the one clip with a
    # genuinely famous local defendant (IZZY93, named in the title) did 3.0K
    # and lost 3x to an anonymous "Drug Dealer BEGS" at 9.8K. What separates
    # 9.8K from 1.4K is liberty decided on camera and a defendant reacting —
    # which human_stakes and dramatic_turn already measure. This axis breaks
    # ties; it does not run the selection.
    rubric_weight: 0.7

  # ---- Repeat-defendant lane -------------------------------------------
  # The highest-leverage format measured anywhere in this niche, and the only
  # one that needs NO new source material — the docket already contains the
  # same people two, five, nineteen times.
  #
  # MEASURED 2026-08-18 on Court Trials TV Network (899 videos, 134K subs, the
  # #1 channel in the niche and holder of 29 of the top 40 videos):
  #   return-appearance titles ("BACK AGAIN", "Watch Both Cases", "UPDATE",
  #   "N Hearings"): median 15,000 views, n=348
  #   one-off titles:                       median 11,000 views, n=551
  #   = 1.36x overall, at essentially the same runtime (17m vs 15m), and it
  #   holds INSIDE every duration band: 1.20x (0-20m), 1.24x (20-30m),
  #   1.84x (30-40m). So it is not a duration proxy.
  #   Their #2, #3, #8, #9, #10 and #15 videos are all return appearances.
  #
  # NOT universal: on Courtroom Time only 3% of the catalogue is this format
  # and it shows no lift (1.01x). It is a Court-Trials-TV play. They are the
  # channel worth copying, so it is adopted deliberately, not by default.
  #
  # INVENTORY ALREADY ON DISK (state/pipeline.db, 727 cases / 50 dockets):
  #   48 defendants appear across 2+ dockets = 155 cases
  #   33 of those clear the gate today (best score >= 50, every hearing
  #      safety_pass) = ~430 minutes of already-scored, already-cleared material
  #   Robert Castillo alone: 19 hearings across 12 dockets, 1,304 minutes
  #
  # `boyd repeats` lists them. Selection prefers a qualifying repeat episode
  # over a same-score one-off; it never promotes anything past the safety gate.
  repeat_defendant:
    enabled: true

    # A defendant must appear in at least this many DISTINCT dockets to
    # qualify. Two separate hearings on the same day are one appearance —
    # the format's value is the return, not the runtime.
    min_dockets: 2

    # At least one of their hearings must clear the normal score gate. The
    # weak hearings are still included in the episode as setup; they just
    # cannot be the reason it was picked.
    min_best_score: 50

    # Every hearing in the episode must have passed safety independently.
    # A single failing hearing drops that hearing, not the episode — unless
    # it is the one that carries the score.
    require_all_safety_pass: true

    # DEPRECATED, inert (verified 2026-09-06: no code reads it). Kept so old
    # configs still load. BOYD_EDITORIAL_V2 PART 5 replaces the multiplier
    # with a TIE-BREAK: a repeat defendant may win only when the two totals
    # are within tie_break_window points (editorial.prefer_repeat). A 79
    # repeat never beats an 88 one-off.
    rank_multiplier: 1.0
    tie_break_window: 3

    # Hearings are always concatenated in chronological order across dockets.
    # Never reorder — the whole point of the format is watching someone come
    # back worse, and a reordered episode manufactures a story arc.
    chronological: true

  # BOYD_EDITORIAL_V2 rubric (2026-09-06). Each dimension is scored on its
  # own scale (0..max) and the total is the plain sum; the numbers below are
  # the MAXIMA and must sum to 100. The single definition is
  # src/boydclips/editorial.py DIMENSIONS; prompts/score_cases.md quotes the
  # same maxima and tests/test_pipeline.py fails if any of the three drift.
  #
  # Replaced the winner/loser-count weights (pushback 30 / boyd_register 25 /
  # receipt 20 / consequence 15 / hook_strength 10): they equated loud
  # defendant, angry judge and serious charge with a good video. Nathan,
  # 2026-09-06: the case needs a STORY ENGINE.
  rubric_weights:
    story_engine: 20           # setup -> escalation/reveal -> payoff, one-sentence explainable
    payoff: 20                 # the footage delivers the receipt ON CAMERA
    boyd_factor: 15            # her editorial contribution, not her presence or volume
    stakes: 15                 # visible consequence tied to the story
    clarity: 10                # who wants what, what went wrong, what happens next
    packaging: 15              # several truthful, materially different title angles
    thumbnail: 5               # a reaction / compact verified line; never rescues a dull case

competitor:
  # Daily lead feeds verified 2026-09-12. Leads never become source media:
  # exact transcript overlap must resolve them to the original court stream.
  enabled: true
  per_channel: 4
  max_leads_per_run: 6
  min_transcript_overlap: 0.08
  channels:
    - name: AmericanJusticeFiles
      url: "https://www.youtube.com/channel/UCPTKs2IWDUdDl_pgbb6YBYQ/videos"
    - name: Court Of Justice
      url: "https://www.youtube.com/channel/UCDXzqbmQZ5daphFQHNyQzKA/videos"
    - name: Boyd's Bench
      url: "https://www.youtube.com/channel/UCAwJ5TfKqjDMYxEQxPR0whw/videos"

packaging:
  # ---- Thumbnail --------------------------------------------------------
  # The construction Nathan approved on Thompson, 2026-08-17: the secondary
  # subject over the courtroom plate on the left, the judge traced out and
  # composited on the right with a feathered, UNSTROKED edge, a red arrow from
  # empty space down into the secondary subject, and the quote in a top band
  # split white -> yellow. Pixel constants are in scripts/make_thumbnail_v2.py,
  # measured from research/reference/competitor/THUMBNAILS.md.
  #
  # src/boydclips/thumbnail.py builds this from the video itself, so the daily
  # run reproduces the approved construction rather than a frame grab.
  thumbnail:
    # thumbnail.mode (Nathan, 2026-09-06):
    #   direct_gen  the finished thumbnails are GENERATED by the image model
    #               from the real assets + the story through Codex orchestration
    #               (tools/thumb_direct.py): three concept families per
    #               case (A defendant-only control, B defendant + Judge Boyd
    #               reaction, C strongest story-prop), bounded self-review,
    #               deterministic QC, 3 x 1280x720 JPEG + manifest + sheet.
    #               An incomplete session is refused by readiness checks.
    #   legacy      the compositor construction below.
    #
    # 2026-09-16: direct_gen is OFF because it needs the Codex built-in
    # `image_gen` tool, and the reachable brain (deepseek-flash) has no image
    # generation. Running it would spend a full edit and then fail at the
    # packaging stage. `legacy` is the local compositor in
    # src/boydclips/thumbnail.py — the construction Nathan approved on
    # Thompson, 2026-08-17 — built from the video itself, no image model. The
    # direct block below is kept intact so flipping back is one line once an
    # image route exists again.
    mode: legacy
    direct:
      # 2026-09-16 (Nathan: "make DeepSeek the production brain"): the direction
      # model is the reachable brain. It writes the Short-thumbnail recipe and
      # the A/B/C meaning review. Image generation itself stays unavailable
      # until an image route is restored, which is why `mode` above is legacy.
      model: deepseek-flash
      effort: high
      budget: 9                  # also the global per-run image ceiling
      retries: 2                 # per concept
      identity_min: 0.55         # SFace cosine vs the source crop (measured 0.73-0.91 on real outputs)
      min_variant_diff: 12.0     # feed-size difference between the three (he could not see 10.5, saw 12.5)
      text_min_height_frac: 0.09
      max_text_words: 12        # complete meaningful copy, including attribution; never cut a thought to fit seven
      ocr_min_recall: 0.6
      hero_face_min_frac: 0.28

    # Which half of the 2-up holds the judge. ASSUMPTION, not a measurement:
    # taken from JgvW7oCQxuI, where the right tile is the taller one (640x500
    # vs 640x360) and holds Boyd. If the court's Zoom layout ever flips, this
    # silently puts the wrong person in the hero slot — check a render after
    # any layout change.
    subject_side: right

    # Arrow tip, in frame fractions. Held at the value used on the approved
    # Thompson render: empty space above the defendant, pointing down-left
    # into him, with his face clear.
    #
    # Measured caveat, deliberately recorded: across 60 thumbnails the red
    # arrow is NOISE — 4/6 winners and 4/4 losers have one. It is here because
    # it is the chosen style, not because the data supports it.
    arrow_tip: [0.30, 0.46]

    # Automatic arrow placement, off deliberately. Tried and measured: the
    # matte traces every person in the plate, and the topmost head belonged to
    # a standing bystander rather than the defendant, which put the arrow in
    # the headline and then on the judge's hair. It needs face detection to be
    # trustworthy. Turn on only to experiment.
    measure_arrow: false

    # A single grab at the hook lands on a motion-blurred frame often enough to
    # matter. Sample this window and keep the sharpest by edge energy.
    search_window_s: 6.0
    frame_samples: 9

  # Title/description/hashtag templates. {placeholders} are filled by the LLM
  # packaging step against the schema in prompts/package_post.md.
  #
  # HOUSE STYLE, Nathan 2026-08-12: spec/PACKAGING.md, measured from Audit the
  # Court. Titles sit in a 50-65 character band with a hard 70 ceiling. The old
  # 100/90 limits here predate that decision and were letting the model ship
  # 122-character titles; analyze.package() now also warns below the floor,
  # which truncation cannot fix.
  title_min_chars: 50

  longform:
    # NOTE: title_template is not read by any code path — the title comes from
    # the model via prompts/package_post.md. Kept only as documentation of the
    # pre-2026-08-12 format.
    title_template: "{hook_line} | Judge Boyd, {court_short}"
    title_max_chars: 70
    description_template: |
      {summary}

      {proceeding_type} before Judge Stephanie Boyd, {court}.
      Recorded from the court's public livestream on {docket_date}.

      This is a public court proceeding. Nothing here is a statement of guilt —
      charges are accusations, and every person appearing is presumed innocent
      unless and until convicted.

      Source: {source_url}
      Timestamp in original stream: {start_timestamp}

      #judgeboyd #courtroom #bexarcounty
    tags:
      - judge boyd
      - judge stephanie boyd
      - 187th district court
      - bexar county
      - courtroom
      - zoom court

  short:
    title_template: "{hook_line}"
    title_max_chars: 70
    # {longform_url} is injected AFTER the long-form publishes. This is the
    # funnel — the short exists to route viewers to the full case.
    description_template: |
      {hook_line}

      ▶ FULL CASE: {longform_url}

      Public proceeding before Judge Stephanie Boyd, {court}.
      Charges are accusations only.

      {hashtags}
    hashtags: "#judgeboyd #courtroom #court #bexarcounty"
    end_card:
      enabled: true
      text: "FULL CASE IN DESCRIPTION"
      duration_s: 2.0

publish:
  # Per-platform switches. Credentials come from config/.env — never here.
  youtube:
    enabled: true

    # HAS THIS GOOGLE CLOUD PROJECT PASSED THE YOUTUBE API COMPLIANCE AUDIT?
    #
    # Leave false until the audit is actually granted. It is not a formality
    # and it is not the same thing as OAuth working.
    #
    # developers.google.com/youtube/v3/docs/videos/insert:
    #   "All videos uploaded via the videos.insert endpoint from unverified API
    #    projects created after 28 July 2020 will be restricted to private
    #    viewing mode."
    #
    # support.google.com/youtube/answer/7300965:
    #   "For videos that have been locked as private due to upload via an
    #    unverified API service, you will not be able to appeal."
    #
    # So the failure is not "it uploads as private and you flip it" — the video
    # is LOCKED private, cannot be appealed, and cannot be made public by hand.
    # The only remedies are to re-upload through the site or to pass the audit.
    # Uploading from an unaudited project therefore spends a case to produce a
    # video nobody can ever see, and publish.py's duplicate guard then refuses
    # to re-upload it. publish_pair() hard-refuses while this is false.
    api_audited: false

    privacy_manual: "private"
    privacy_assisted: "private"
    privacy_auto: "public"
    category_id: "25"          # News & Politics
    made_for_kids: false
  tiktok:
    enabled: false             # flip on once the Content Posting API is approved
    privacy_manual: "SELF_ONLY"
    privacy_auto: "PUBLIC_TO_EVERYONE"
  instagram:
    enabled: false             # needs Business account + linked FB Page
    share_to_feed: true

paths:
  work: "work"                 # per-run scratch, safe to delete
  out: "out"
  state_db: "state/pipeline.db"
  logs: "logs"

retention:
  # Housekeeping so a daily job doesn't fill the disk.
  work_days: 3
  posted_days: 90
  keep_transcripts_days: 365   # transcripts are tiny and useful for backfill
